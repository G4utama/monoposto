<!DOCTYPE html>
<html>
<head>

    <div class="chart">
        <canvas id="teamsChart"></canvas>
    </div>
    <script>
        createDriversChart(['CAM 1', 'DUR 2', 'MIY 3', 'HER 4', 'LEO 5', 'TSO 6', 'BEG 7', 'BIL 8', 'MIN 9', 'GOE 10', 'MON 11', 'BOY 12', 'STE 14', 'DUN 15', 'MAI 16', 'INT 17', 'FIT 20', 'SHI 21', 'VAR 22', 'YAM 22', 'VIL 23', 'HOE 24', 'BEN 25'], 'driversChart');
        createTeamsChart(['AIX', 'ART', 'CAM', 'DAM', 'HIT', 'INV', 'MP_', 'PRE', 'ROD', 'TRI', 'VAN'], 'teamsChart');
    </script>
</body>
</html>
